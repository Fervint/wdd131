<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Formulário de avaliação de produto desenvolvido por Fabio Ricardo para o curso WDD131.">
    <meta name="author" content="Fabio Ricardo">
    <title>Avaliação do Produto</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Formulário de Avaliação de Produto</h1>
    </header>

    <form action="avaliacao.html" method="get">
        <label for="produto">Nome do Produto:</label>
        <select id="produto" name="produto" required>
            <option value="" disabled selected>Selecione um produto...</option>
        </select>

        <fieldset>
            <legend>Classificação Geral:</legend>
            <div class="radio-group">
                <label for="estrela1"><input type="radio" id="estrela1" name="classificacao" value="1" required>
                    ★</label>
                <label for="estrela2"><input type="radio" id="estrela2" name="classificacao" value="2" required>
                    ★★</label>
                <label for="estrela3"><input type="radio" id="estrela3" name="classificacao" value="3" required>
                    ★★★</label>
                <label for="estrela4"><input type="radio" id="estrela4" name="classificacao" value="4" required>
                    ★★★★</label>
                <label for="estrela5"><input type="radio" id="estrela5" name="classificacao" value="5" required>
                    ★★★★★</label>
            </div>
        </fieldset>

        <label for="data">Data de Instalação:</label>
        <input type="date" id="data" name="data" required>

        <fieldset>
            <legend>Recursos Úteis:</legend>
            <div class="checkbox-group">
                <label for="durabilidade"><input type="checkbox" id="durabilidade" name="recursos" value="durabilidade">
                    Durabilidade</label>
                <label for="facilidade"><input type="checkbox" id="facilidade" name="recursos" value="facilidade">
                    Facilidade de Uso</label>
                <label for="desempenho"><input type="checkbox" id="desempenho" name="recursos" value="desempenho">
                    Desempenho</label>
                <label for="design"><input type="checkbox" id="design" name="recursos" value="design"> Design</label>
            </div>
        </fieldset>

        <label for="avaliacao">Avaliação Escrita (opcional):</label>
        <textarea id="avaliacao" name="avaliacao"></textarea>

        <label for="usuario">Seu Nome (opcional):</label>
        <input type="text" id="usuario" name="usuario">

        <input type="submit" value="Publicar Avaliação">
    </form>

    <footer>
        <p>©2026 💻 Fabio Ricardo Da Silva Muniz 💻 Brasil</p>
        <p>Última Modificação: 07/31/2026 17:37:00</p>
    </footer>
</body>

</html>
